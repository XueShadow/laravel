services:
  - type: web
    name: pre-enrollment
    env: php
    phpVersion: 8.3
    plan: free
    buildCommand: composer install && npm install && npm run build
    startCommand: php -S 0.0.0.0:10000 -t public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: pre-enrollment-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pre-enrollment-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pre-enrollment-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pre-enrollment-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pre-enrollment-db
          property: password
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
    preDeployCommand: php artisan migrate --force && php artisan seed --force && php artisan config:cache && php artisan route:cache

databases:
  - name: pre-enrollment-db
    engine: postgres
    plan: free
    version: "15"
